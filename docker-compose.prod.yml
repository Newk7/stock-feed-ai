services:
  postgres:
    restart: unless-stopped
    ports:
      - "127.0.0.1:5433:5432"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  server:
    restart: unless-stopped
    environment:
      NODE_ENV: production
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  client:
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
